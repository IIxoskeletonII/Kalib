# Every push and pull request: the same four checks `npm run deploy` runs locally, plus a
# dependency audit. No secrets are needed — the build has no keys, and deploys stay manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build

      - name: Worker config validates
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

      - name: Browser smoke tests (onboard → log → recipe → plan; offline)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
